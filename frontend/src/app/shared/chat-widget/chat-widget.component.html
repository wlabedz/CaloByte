@if (visible()) {
  @if (open()) {
    <section class="panel" role="dialog" aria-labelledby="chat-widget-title">
      <header class="panel-header">
        <h2 id="chat-widget-title" class="panel-title">Asystent dietetyczny</h2>
        @if (chat.entries().length > 0) {
          <button type="button" class="panel-link" (click)="chat.newConversation()">
            Nowa rozmowa
          </button>
        }
        <a class="panel-link" routerLink="/chat" (click)="open.set(false)">Pełny ekran</a>
        <button type="button" class="close" aria-label="Zamknij czat" (click)="close()">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </header>
      <div class="panel-body">
        <app-chat-thread [compact]="true" />
      </div>
    </section>
  }

  <button
    #fabButton
    type="button"
    class="fab"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="open() ? 'Zamknij czat' : 'Otwórz czat z asystentem'"
    (click)="toggle()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      @if (open()) {
        <path d="M6 9l6 6 6-6" />
      } @else {
        <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5A8 8 0 1 1 21 12z" />
      }
    </svg>
    @if (chat.loading() && !open()) {
      <span class="busy" aria-hidden="true"></span>
    }
  </button>
}
